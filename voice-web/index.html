<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141414">
<title>Sift</title>
<style>
  :root { color-scheme: dark; --green: #b5dc9e; --text: #ececec; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 28px; padding: 24px; background: #141414; color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  button { width: 168px; height: 168px; border-radius: 50%; border: 0; background: #262626; color: var(--text);
           font: 600 17px -apple-system, system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
           box-shadow: 0 0 0 calc(var(--level, 0) * 26px) rgba(181, 220, 158, .28); transition: box-shadow .08s, background .15s; }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 6px; }
  button.listening { background: var(--green); color: #141414; }
  button.waiting { background: #303030; }
  #status { color: var(--muted); min-height: 1.45em; text-align: center; }
  #log { width: min(100%, 520px); display: flex; flex-direction: column; gap: 10px; }
  #log p { margin: 0; } #log .you { color: var(--muted); }
</style>
</head>
<body>
<button id="talk" aria-live="polite">Tap to talk</button>
<div id="status" role="status">Tap, talk, tap again to send.</div>
<div id="log"></div>
<audio id="voice" playsinline></audio>
<script>
const button = document.getElementById("talk"), status = document.getElementById("status");
const log = document.getElementById("log"), voice = document.getElementById("voice");
let recorder, chunks = [], stream, meter, stopQueue = false, state = "idle", turn = 0;

function set(next, label, text) { state = next; button.className = next; button.textContent = label; status.textContent = text; }
function say(cls, text) { const p = document.createElement("p"); p.className = cls; p.textContent = text; log.prepend(p); }

async function play(url) {
  voice.src = url;
  const ended = new Promise((done) => { voice.onended = done; voice.onerror = done; voice.onpause = done; });
  try { await voice.play(); } catch { return; } // nothing to play, or blocked: move on
  await ended;
}

async function start(context) {
  stream = stream ?? await navigator.mediaDevices.getUserMedia({ audio: true });
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) ?? "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.start();
  const analyser = context.createAnalyser(), data = new Uint8Array(256);
  context.createMediaStreamSource(stream).connect(analyser);
  meter = setInterval(() => {
    analyser.getByteTimeDomainData(data);
    const peak = Math.max(...data.map((v) => Math.abs(v - 128))) / 128;
    button.style.setProperty("--level", Math.min(1, peak * 2.5).toFixed(2));
  }, 60);
  meter.context = context;
  set("listening", "Tap to send", "Listening…");
}

async function finish() {
  const mine = ++turn;
  const settle = (label, text) => { if (turn === mine) set("idle", label, text); };
  clearInterval(meter); meter.context.close(); button.style.setProperty("--level", 0);
  const stopped = new Promise((done) => (recorder.onstop = done));
  recorder.stop();
  // The acknowledgement plays inside the tap, which also unlocks audio for the reply on iPhone.
  voice.src = "/api/ack"; voice.play().catch(() => {});
  await stopped;
  set("waiting", "Thinking…", "Okay, let me look.");
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  try {
    const response = await fetch("/api/talk", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Something went wrong.");
    if (!result.heard) { settle("Tap to talk", "Didn't catch anything; nothing was sent."); return; }
    say("you", result.heard);
    if (result.reply) say("sift", result.reply);
    if (turn !== mine) return;
    set("speaking", "Tap to stop", "Speaking…");
    stopQueue = false;
    while (!voice.paused) await new Promise((r) => setTimeout(r, 100)); // let the acknowledgement finish
    for (const clip of result.clips) { if (stopQueue || turn !== mine) break; await play("data:audio/mpeg;base64," + clip); }
    settle("Tap to talk", "Tap, talk, tap again to send.");
  } catch (error) {
    settle("Tap to talk", error.message);
  }
}

button.addEventListener("click", () => {
  if (state === "idle") {
    // Made inside the tap so iPhone lets the level meter run.
    const context = new AudioContext();
    context.resume();
    start(context).catch((e) => { context.close(); set("idle", "Tap to talk", "Microphone unavailable: " + e.message); });
  }
  else if (state === "listening") finish();
  else if (state === "speaking") { stopQueue = true; turn++; voice.pause(); set("idle", "Tap to talk", "Stopped."); }
});
</script>
</body>
</html>
