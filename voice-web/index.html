<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Voice</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e; --panel: #15171a; --line: rgba(255,255,255,.07);
    --text: #eceef0; --muted: #8b9096; --green: #a8e0a0; --mint: #6fd6c4; --violet: #9b8cff;
    --level: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before { /* soft light that follows the state */
    content: ""; position: fixed; inset: auto -20% -30% -20%; height: 70%; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--glow, var(--violet)) 22%, transparent), transparent);
    filter: blur(40px); opacity: .7; transition: background .6s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 10px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  #chip {
    font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); display: flex; gap: 6px; align-items: center;
  }
  #chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--glow, var(--muted)); }

  #thread {
    flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 22px;
    -webkit-mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent);
  }
  #empty { margin: auto 0; text-align: center; color: var(--muted); }
  #empty strong { display: block; color: var(--text); font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  .turn { display: flex; flex-direction: column; gap: 12px; animation: rise .35s ease-out both; }
  .you {
    align-self: flex-end; max-width: 85%; margin: 0; padding: 10px 14px; border-radius: 18px 18px 6px 18px;
    background: #23262b; color: var(--text);
  }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; animation: rise .25s ease-out both; }
  .step::before {
    content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--mint) 35%, transparent); border-top-color: var(--mint);
    animation: spin .8s linear infinite;
  }
  .step.done::before {
    content: "✓"; animation: none; border: 0; color: var(--mint); font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  .more { color: var(--muted); font-size: 12px; opacity: .7; padding-left: 24px; }
  .reply { margin: 0; white-space: pre-wrap; font-size: 17px; line-height: 1.55; letter-spacing: -.005em; }
  .reply:empty { display: none; }
  .note { color: var(--muted); font-size: 14px; margin: 0; }

  /* Bottom: the orb floats over one frosted dock that holds the text box. */
  footer {
    position: relative; display: flex; justify-content: center;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 85%, transparent) 30%);
  }
  #talk { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    position: relative; flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: transparent; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #talk:focus-visible { outline: 3px solid var(--green); outline-offset: 6px; }
  .orb, .halo { position: absolute; inset: 0; border-radius: 50%; }
  /* A soft orb: three blurred colour blobs drifting inside a circle, no hard edges. */
  .orb {
    overflow: hidden; isolation: isolate; background: #16122a;
    box-shadow: 0 12px 40px -10px color-mix(in srgb, var(--glow, var(--violet)) 75%, transparent), inset 0 0 0 1px rgba(255,255,255,.08);
    transform: scale(calc(1 + var(--level) * .2)); transition: transform .08s ease-out, box-shadow .6s;
  }
  .orb i { position: absolute; width: 85%; height: 85%; border-radius: 50%; filter: blur(8px); mix-blend-mode: screen; opacity: .95;
    animation: var(--drift-time, 9s) ease-in-out infinite alternate; }
  .orb i:nth-child(1) { background: var(--violet); top: -18%; left: -14%; animation-name: drift1; }
  .orb i:nth-child(2) { background: var(--mint); bottom: -20%; right: -16%; animation-name: drift2; }
  .orb i:nth-child(3) { background: var(--green); top: 30%; left: 20%; width: 60%; height: 60%; opacity: .7; animation-name: drift3; }
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.45), transparent 38%); }
  .halo { border: 2px solid color-mix(in srgb, var(--glow, var(--violet)) 60%, transparent); opacity: 0; }
  .dock { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); padding: 6px; border-radius: 30px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); }
  #hint { font-size: 13px; color: var(--muted); min-height: 1.5em; text-align: center; }

  body.listening { --glow: var(--green); }
  body.listening { --drift-time: 3s; }
  body.listening .halo { animation: ripple 1.6s ease-out infinite; }
  body.waiting { --glow: var(--mint); }
  body.waiting { --drift-time: 1.6s; }
  body.speaking { --glow: var(--violet); }
  body.speaking { --drift-time: 2.4s; }
  body.speaking .orb { animation: talkpulse .5s ease-in-out infinite alternate; }

  @property --turn { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes drift1 { to { transform: translate(28%, 22%) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-26%, -20%) scale(.92); } }
  @keyframes drift3 { to { transform: translate(-30%, 18%) scale(1.15); } }
  @keyframes breathe { 50% { filter: brightness(1.12) saturate(1.15); } }
  @keyframes talkpulse { to { transform: scale(1.07); } }
  @keyframes ripple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
  /* Work card, after ReUI's ai-chat-8: who was asked, then each check with a tick. */
  .job { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: rise .3s ease-out both; }
  .job .head { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .job .head .time { margin-left: auto; font-variant-numeric: tabular-nums; }
  .job .head::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); animation: breathe 1.2s ease-in-out infinite; }
  .job.done .head::before { background: var(--green); animation: none; }
  .job.failed .head::before { background: #ff8a7a; animation: none; }
  .job .title { font-size: 15px; color: var(--text); }
  .job ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .job li { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .job li::before { content: "✓"; color: var(--mint); font-weight: 700; width: 12px; }
  .job.running li:last-child::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--mint) 35%, transparent); border-top-color: var(--mint); animation: spin .8s linear infinite; }
  .you .label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em; }
  header .top { display: flex; gap: 8px; align-items: center; }
  #endChat { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  #endChat:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  form#ask { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  form#ask input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 16px; outline: none; }
  form#ask input::placeholder { color: var(--muted); }
  form#ask button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 16px; cursor: pointer; }
  form#ask button:disabled { opacity: .3; }
  .sift { margin: 0; font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>
<header><h1 id="name"></h1><div class="top"><span id="chip">Ready</span><button id="endChat" type="button" hidden aria-label="End the conversation">End</button></div></header>
<main id="thread" aria-live="polite">
  <div id="empty"><strong>Just talk</strong>Tap the orb to start. Tap it again to pause listening.<br>Talk over me to interrupt, or type instead.</div>
</main>
<footer>
  <div class="dock">
    <button id="talk" aria-label="Start talking"><span class="halo"></span><span class="orb"><i></i><i></i><i></i></span></button>
    <form id="ask" autocomplete="off"><input id="typed" aria-label="Type a question" aria-describedby="hint"><button aria-label="Send" disabled>↑</button></form>
  </div>
  <div id="hint" class="sr" role="status">Tap to start</div>
</footer>
<script>
// The call runs on Pipecat (pipecat/bot.py): one WebRTC call carries your voice in and its voice out,
// and Pipecat decides turns and interruptions. Events about the call come back on its data channel (RTVI).
const $ = (id) => document.getElementById(id);
const empty = $("empty"), button = $("talk"), hint = $("hint"), chip = $("chip"), thread = $("thread");
const IDLE_HANGUP = 5 * 60_000; // ponytail: a call nobody speaks in for 5 minutes hangs up, so the mic is never left open
let phase = "off", pc = null, dc = null, micStream = null, micTrack = null, muted = false, ready = false, waiting = [];
let ping = 0, idleTimer = 0, endAfterSpeech = false, botSpeaking = false, levelCtx = null, micLevel = null, botLevel = null;
let you = null, youText = "", reply = null, steps = null, working = new Map(), sender = null, micLost = false;
const speaker = new Audio(); speaker.autoplay = true; speaker.setAttribute("playsinline", "");

const LABELS = { off: "Ready", connecting: "Connecting", muted: "Not listening", listening: "Listening", hearing: "Hearing you", thinking: "Thinking", speaking: "Speaking" };
function set(next, text) {
  phase = next;
  document.body.className = { off: "idle", connecting: "waiting", muted: "idle", listening: "listening", hearing: "listening", thinking: "waiting", speaking: "speaking" }[next];
  hint.textContent = text ?? { off: "Tap to start", connecting: "Connecting…", muted: "Not listening · tap to talk", listening: "Listening · tap to pause", hearing: "Go on…", thinking: "One sec…", speaking: "Talk over me, or tap, to interrupt" }[next];
  $("typed").placeholder = hint.textContent || "Type instead";
  button.setAttribute("aria-label", !pc ? "Start talking" : { listening: "Stop listening", hearing: "Stop listening", muted: "Listen" }[phase] ?? "Interrupt and listen");
  $("endChat").hidden = !pc;
  chipWork();
}
function el(tag, cls, text) { const n = document.createElement(tag); n.className = cls; if (text) n.textContent = text; return n; }
function add(node) { empty.remove(); thread.append(node); thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" }); return node; }
function audioMode(type) { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch {} }
function rtvi(type, data) { if (dc?.readyState === "open") dc.send(JSON.stringify({ label: "rtvi-ai", type, id: crypto.randomUUID?.() ?? String(Date.now()), data })); }
function awake() { clearTimeout(idleTimer); if (pc) idleTimer = setTimeout(() => hangUp("Paused after a quiet spell. Tap to talk again."), IDLE_HANGUP); }

// ---- The call
async function connect() {
  set("connecting");
  audioMode("play-and-record");
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  micTrack = micStream.getAudioTracks()[0];
  watchMic(micTrack);
  micLost = micTrack.muted; // already taken by another tab: shown once the call is up
  micTrack.enabled = !muted;
  levelCtx = new (window.AudioContext || window.webkitAudioContext)();
  await levelCtx.resume();
  micLevel = meter(micStream);
  pc = new RTCPeerConnection({ iceServers: [] }); // tailnet only: both ends reach each other directly
  const audio = pc.addTransceiver("audio", { direction: "sendrecv" }); // audio only: no camera, no video
  sender = audio.sender;
  await audio.sender.replaceTrack(micTrack);
  dc = pc.createDataChannel("chat", { ordered: true });
  dc.onopen = () => {
    rtvi("client-ready", { version: "2.3.0", about: { library: "sift-voice", library_version: "1.0.0" } });
    ping = setInterval(() => dc?.readyState === "open" && dc.send("ping: " + Date.now()), 1000); // Pipecat's keep-alive
  };
  dc.onmessage = (message) => { let m; try { m = JSON.parse(message.data); } catch { return; } if (m.label === "rtvi-ai") onEvent(m); };
  pc.ontrack = (event) => {
    if (event.track.kind !== "audio") return;
    const stream = new MediaStream([event.track]);
    speaker.srcObject = stream; speaker.play().catch(() => {});
    try { botLevel = meter(stream); } catch {}
  };
  let dropped = 0;
  pc.onconnectionstatechange = () => {
    const state = pc?.connectionState;
    if (state === "failed") hangUp("The call dropped. Tap to talk again.");
    else if (state === "disconnected") dropped = setTimeout(() => pc?.connectionState === "disconnected" && hangUp("The call dropped. Tap to talk again."), 6000);
    else if (state === "connected") clearTimeout(dropped);
  };
  await pc.setLocalDescription(await pc.createOffer());
  await gathered(pc, 2500);
  const response = await fetch("/api/offer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type, pc_id: null, restart_pc: false }) });
  const answer = await response.json().catch(() => ({}));
  if (!response.ok || !answer.sdp) throw new Error(answer.error || answer.detail || "The voice engine didn't answer.");
  await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
  awake();
}
function gathered(peer, ms) {
  return new Promise((done) => {
    if (peer.iceGatheringState === "complete") return done();
    const timer = setTimeout(done, ms);
    peer.addEventListener("icegatheringstatechange", () => peer.iceGatheringState === "complete" && (clearTimeout(timer), done()));
  });
}
function hangUp(text) {
  rtvi("disconnect-bot");
  clearInterval(ping); clearTimeout(idleTimer);
  try { dc?.close(); } catch {} try { pc?.close(); } catch {}
  pc = null; dc = null; sender = null; micLost = false; ready = false; waiting = []; endAfterSpeech = false; botSpeaking = false; muted = false;
  micStream?.getTracks().forEach((t) => t.stop()); micStream = null; micTrack = null;
  speaker.srcObject = null;
  levelCtx?.close().catch(() => {}); levelCtx = null; micLevel = botLevel = null;
  audioMode("playback");
  steps?.querySelectorAll(".step").forEach((s) => s.classList.add("done"));
  you = null; reply = null; steps = null;
  set("off", text);
}
function listenOrMute() { if (micLost) return micPaused(); set(muted ? "muted" : "listening"); }

// ---- The phone can take the mic away (another tab or app using it, a call, the screen locking).
// Then nothing reaches the call, so say so instead of "Listening", and get it back on the next tap.
const MIC_PAUSED = "Your phone paused the mic. Close other tabs using it, then tap the orb.";
function micPaused() { set("muted", MIC_PAUSED); chip.textContent = "Mic paused"; }
function watchMic(track) {
  track.onmute = () => { if (track !== micTrack) return; micLost = true; micPaused(); };
  track.onunmute = () => { if (track !== micTrack) return; micLost = false; listenOrMute(); };
  track.onended = () => { if (track !== micTrack || !pc) return; micLost = true; micPaused(); };
}
async function regainMic() {
  const fresh = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  micStream?.getTracks().forEach((t) => t.stop());
  micStream = fresh; micTrack = fresh.getAudioTracks()[0]; micTrack.enabled = !muted;
  watchMic(micTrack);
  await sender.replaceTrack(micTrack);
  try { micLevel = meter(fresh); } catch {}
  micLost = micTrack.muted;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && pc && (micLost || micTrack?.readyState === "ended")) regainMic().then(listenOrMute).catch(() => micPaused());
});

// ---- What the call tells us
function onEvent({ type, data }) {
  if (type === "bot-ready") { ready = true; listenOrMute(); waiting.splice(0).forEach(typedSend); return; }
  if (type === "user-started-speaking") { awake(); if (muted) return; if (!you) startYou("You said"); set("hearing"); return; }
  if (type === "user-transcription" && data?.text) {
    if (!you) startYou("You said");
    if (data.final) youText = `${youText} ${data.text}`.trim();
    you.querySelector(".words").textContent = data.final ? youText : `${youText} ${data.text}`.trim();
    return;
  }
  if (type === "user-stopped-speaking") { if (phase === "hearing") set("thinking"); return; }
  if (type === "bot-llm-started") { closeYou(); reply = null; if (phase !== "speaking") set("thinking"); return; }
  if (type === "bot-llm-text" && data?.text) {
    finishSteps();
    if (!reply) reply = add(el("p", "sift"));
    reply.textContent = (reply.textContent + data.text).replace(/^\s+/, "");
    thread.scrollTo({ top: thread.scrollHeight });
    return;
  }
  if (type === "bot-started-speaking") { awake(); botSpeaking = true; set("speaking"); return; }
  if (type === "bot-stopped-speaking") {
    botSpeaking = false;
    if (endAfterSpeech) return void setTimeout(() => hangUp("Bye. Tap to talk again."), 300);
    listenOrMute(); return;
  }
  if (type === "server-message" && data?.type === "tool") { showStep(data); return; }
  if (type === "server-message" && data?.type === "end") {
    endAfterSpeech = true;
    setTimeout(() => endAfterSpeech && !botSpeaking && hangUp("Bye. Tap to talk again."), 2500);
    return;
  }
  if (type === "error" && data?.message) add(el("p", "note", data.message));
}
function startYou(label) {
  closeYou();
  you = el("p", "you"); you.append(el("span", "label", label), el("span", "words", "…"));
  youText = "";
  add(you);
}
function closeYou() {
  if (you && !youText && you.querySelector(".words").textContent === "…") you.remove(); // nothing was really said
  you = null; youText = "";
}
/** What it's doing: one line per tool, ticked off when the answer starts. */
function showStep({ name, label, args }) {
  closeYou();
  if (!steps) steps = add(el("ul", "steps"));
  steps.querySelectorAll(".step").forEach((s) => s.classList.add("done"));
  const detail = name === "paseo" ? args?.command : name === "read_session" || name === "read_source" || name === "skill" ? args?.name : name === "delegate" ? args?.to : "";
  steps.append(el("li", "step", detail ? `${label}: ${detail}` : label));
  if (phase !== "speaking") set("thinking");
}
function finishSteps() { steps?.querySelectorAll(".step").forEach((s) => s.classList.add("done")); steps = null; }

// ---- The orb's size follows whoever is talking
function meter(stream) {
  const analyser = levelCtx.createAnalyser(); analyser.fftSize = 1024;
  levelCtx.createMediaStreamSource(stream).connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  return () => { analyser.getFloatTimeDomainData(data); let sum = 0; for (const v of data) sum += v * v; return Math.sqrt(sum / data.length); };
}
(function frame() {
  const source = phase === "speaking" ? botLevel : phase === "listening" || phase === "hearing" ? micLevel : null;
  const rms = source ? source() : 0;
  document.documentElement.style.setProperty("--level", Math.min(1, rms * 9).toFixed(2));
  requestAnimationFrame(frame);
})();

/** The header chip also says when a session is still working in the background. */
function chipWork() {
  const busy = [...working.values()];
  const base = LABELS[phase] ?? "";
  chip.textContent = busy.length ? `${base} · ${busy.length === 1 ? busy[0] + " working" : busy.length + " working"}` : base;
}
const elapsed = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; };
const shortTask = (task) => { const t = task.replace(/^\(.*?\)\s*/, "").replace(/^(jon|he|she|they)\s+(says|asks|wants)[:,]?\s*/i, ""); return t.length > 110 ? t.slice(0, 107).trimEnd() + "…" : t; };
setInterval(() => cards.forEach((card) => { if (card.dataset.started && card.classList.contains("running")) card.querySelector(".time").textContent = elapsed(Date.now() - Number(card.dataset.started)); }), 1000);

// ---- Background work from the worker sessions: cards that update. News is spoken inside an open call;
// with no call open, the server sends it as clips, played if this page has been tapped once.
const cards = new Map();
function showJob(job) {
  let card = cards.get(job.id);
  if (!card) {
    card = add(el("div", "job"));
    const head = el("div", "head"); head.append(el("span", "who"), el("span", "time"));
    card.append(head, el("div", "title"), el("ul", ""));
    cards.set(job.id, card);
  }
  if (job.status === "cancelled") { card.remove(); cards.delete(job.id); working.delete(job.id); chipWork(); return; }
  card.className = `job ${job.status}`;
  card.dataset.started = job.started ?? "";
  const who = job.to ?? "the worker", Who = who[0].toUpperCase() + who.slice(1);
  card.querySelector(".who").textContent = { queued: `Waiting for ${who}`, running: `Asked ${who}`, done: `${Who} answered`, failed: `${Who} didn't finish` }[job.status] ?? job.status;
  if (job.status !== "running") card.querySelector(".time").textContent = "";
  const title = card.querySelector(".title");
  title.textContent = shortTask(job.task); title.title = job.task;
  card.querySelector("ul").replaceChildren(...job.steps.filter((s) => s !== "Thinking").slice(-2).map((s) => el("li", "", s)));
  if (job.status === "running" || job.status === "queued") working.set(job.id, Who); else working.delete(job.id);
  chipWork();
}
let tapped = false, clips = Promise.resolve();
const events = new EventSource("/api/events");
events.onmessage = (message) => {
  const event = JSON.parse(message.data);
  if (event.type === "job") showJob(event.job);
  if (event.type === "say") {
    add(el("p", "sift", event.text));
    if (!pc && tapped && event.audio?.length) {
      hint.textContent = "News from your worker";
      for (const b64 of event.audio) clips = clips.then(() => new Promise((done) => { const a = new Audio(`data:audio/mpeg;base64,${b64}`); a.onended = a.onerror = done; a.play().catch(done); }));
    }
  }
};
fetch(`/api/config?tz=${encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone ?? "")}`).then((r) => r.json()).then((c) => {
  $("name").textContent = c.title; document.title = c.title; c.jobs.forEach(showJob);
});

// ---- Typing: goes into the same call (one is started, listening paused, if none is open).
const form = $("ask"), typed = $("typed"), sendButton = form.querySelector("button");
typed.addEventListener("input", () => (sendButton.disabled = !typed.value.trim()));
function typedSend(text) {
  startYou("You typed"); you.querySelector(".words").textContent = text; youText = text;
  rtvi("send-text", { content: text, options: { run_immediately: true, audio_response: true } });
  set("thinking"); awake();
}
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = typed.value.trim();
  if (!text) return;
  typed.value = ""; sendButton.disabled = true; tapped = true;
  speaker.play().catch(() => {}); // this tap lets the reply play
  if (ready) return typedSend(text);
  waiting.push(text);
  if (!pc) { muted = true; connect().catch((e) => hangUp("Couldn't start: " + e.message)); }
});

// Tap in and out: the orb switches listening on and off; the call carries on until "End" or bye.
button.addEventListener("click", () => {
  tapped = true;
  speaker.play().catch(() => {}); // unlocks playback on iPhone from this tap
  if (!pc) { muted = false; connect().catch((e) => hangUp("Couldn't start: " + e.message)); return; }
  if (phase === "connecting") return;
  if (phase === "listening" || phase === "hearing") { muted = true; micTrack.enabled = false; set("muted"); return; }
  if (micLost || micTrack.readyState === "ended" || micTrack.muted) { // the phone took the mic: ask for it back
    muted = false;
    regainMic().then(() => (micLost ? micPaused() : set("listening", "Go ahead, I'm listening"))).catch((e) => { micLost = true; micPaused(); hint.textContent = "Mic unavailable: " + e.message; });
    return;
  }
  muted = false; micTrack.enabled = true; awake();
  if (phase === "speaking" || phase === "thinking") rtvi("client-message", { t: "interrupt" });
  set("listening", "Go ahead, I'm listening");
});
$("endChat").addEventListener("click", () => hangUp("Ended. Tap to talk again."));
set("off");
</script>
</body>
</html>
