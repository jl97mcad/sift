<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<title>Sift</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e; --panel: #15171a; --line: rgba(255,255,255,.07);
    --text: #eceef0; --muted: #8b9096; --green: #a8e0a0; --mint: #6fd6c4; --violet: #9b8cff;
    --level: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before { /* soft light that follows the state */
    content: ""; position: fixed; inset: auto -20% -30% -20%; height: 70%; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--glow, var(--violet)) 22%, transparent), transparent);
    filter: blur(40px); opacity: .7; transition: background .6s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 10px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  #chip {
    font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); display: flex; gap: 6px; align-items: center;
  }
  #chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--glow, var(--muted)); }

  #thread {
    flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 22px;
    -webkit-mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent);
  }
  #empty { margin: auto 0; text-align: center; color: var(--muted); }
  #empty strong { display: block; color: var(--text); font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  .turn { display: flex; flex-direction: column; gap: 12px; animation: rise .35s ease-out both; }
  .you {
    align-self: flex-end; max-width: 85%; margin: 0; padding: 10px 14px; border-radius: 18px 18px 6px 18px;
    background: #23262b; color: var(--text);
  }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; animation: rise .25s ease-out both; }
  .step::before {
    content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--mint) 35%, transparent); border-top-color: var(--mint);
    animation: spin .8s linear infinite;
  }
  .step.done::before {
    content: "✓"; animation: none; border: 0; color: var(--mint); font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  .more { color: var(--muted); font-size: 12px; opacity: .7; padding-left: 24px; }
  .reply { margin: 0; white-space: pre-wrap; font-size: 17px; line-height: 1.55; letter-spacing: -.005em; }
  .reply:empty { display: none; }
  .note { color: var(--muted); font-size: 14px; margin: 0; }

  footer {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  #talk { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    position: relative; width: 84px; height: 84px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: transparent; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #talk:focus-visible { outline: 3px solid var(--green); outline-offset: 6px; }
  .orb, .halo { position: absolute; inset: 0; border-radius: 50%; }
  .orb {
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 42%),
      conic-gradient(from var(--turn, 0deg), var(--violet), var(--mint), var(--green), var(--violet));
    box-shadow: 0 10px 40px -8px color-mix(in srgb, var(--glow, var(--violet)) 70%, transparent);
    animation: turn 9s linear infinite, breathe 4s ease-in-out infinite;
    transform: scale(calc(1 + var(--level) * .22)); transition: transform .08s ease-out;
  }
  .halo { border: 2px solid color-mix(in srgb, var(--glow, var(--violet)) 60%, transparent); opacity: 0; }
  #hint { font-size: 13px; color: var(--muted); min-height: 1.5em; text-align: center; }

  body.listening { --glow: var(--green); }
  body.listening .orb { animation: turn 3s linear infinite; }
  body.listening .halo { animation: ripple 1.6s ease-out infinite; }
  body.waiting { --glow: var(--mint); }
  body.waiting .orb { animation: turn 1.4s linear infinite, breathe 1.4s ease-in-out infinite; }
  body.speaking { --glow: var(--violet); }
  body.speaking .orb { animation: turn 4s linear infinite, talkpulse .5s ease-in-out infinite alternate; }

  @property --turn { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes turn { to { --turn: 360deg; } }
  @keyframes breathe { 50% { filter: brightness(1.12) saturate(1.15); } }
  @keyframes talkpulse { to { transform: scale(1.07); } }
  @keyframes ripple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header><h1>Sift</h1><span id="chip">Ready</span></header>
<main id="thread" aria-live="polite">
  <div id="empty"><strong>Ask me anything</strong>Tap the orb and talk, then tap again.<br>Or hold it while you talk.</div>
</main>
<footer>
  <button id="talk" aria-label="Tap to talk"><span class="halo"></span><span class="orb"></span></button>
  <div id="hint" role="status">Tap to talk</div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const empty = $("empty"), button = $("talk"), hint = $("hint"), chip = $("chip"), thread = $("thread");
let controller, recorder, chunks = [], stream, meter, meterContext, state = "idle", turn = 0, queue = [], playing = false, stopped = false;

const labels = { idle: ["Ready", "Tap to talk"], starting: ["Ready", "Opening the microphone…"],
  listening: ["Listening", "Tap or let go to send"], waiting: ["Working", "Tap to stop"], speaking: ["Speaking", "Tap to stop"] };
function set(next, hintText) {
  state = next;
  document.body.className = next;
  chip.textContent = labels[next][0];
  hint.textContent = hintText ?? labels[next][1];
  button.setAttribute("aria-label", labels[next][1]);
}
function el(tag, cls, text) { const node = document.createElement(tag); node.className = cls; if (text) node.textContent = text; return node; }
function scroll() { thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" }); }

function newTurn() {
  empty.remove();
  const box = el("section", "turn");
  const you = el("p", "you", "…"), steps = el("ol", "steps"), reply = el("p", "reply");
  box.append(you, steps, reply);
  thread.append(box);
  scroll();
  return { box, you, steps, reply };
}

// Replies play through one Web Audio context made inside a press. iPhone lets a context that was
// started by a tap keep playing later clips; a plain <audio> element only played the first one.
let player, current;
function unlockPlayer() {
  player = player ?? new (window.AudioContext || window.webkitAudioContext)();
  player.resume();
  const silence = player.createBufferSource();
  silence.buffer = player.createBuffer(1, 1, 22050);
  silence.connect(player.destination);
  silence.start(0);
}

async function playClip(bytes, mine) {
  const buffer = await player.decodeAudioData(bytes);
  if (stopped || turn !== mine) return; // stopped while it decoded
  if (player.state !== "running") await player.resume();
  await new Promise((done) => {
    const source = player.createBufferSource();
    source.buffer = buffer;
    source.connect(player.destination);
    source.onended = done;
    current = source;
    if (state === "waiting") set("speaking"); // only once audio really starts
    source.start();
  });
  current = null;
}

async function playQueue(mine) {
  if (playing) return;
  playing = true;
  while (queue.length && !stopped && turn === mine) {
    const next = queue.shift();
    try {
      const bytes = typeof next === "string" ? await (await fetch(next)).arrayBuffer() : next;
      if (stopped || turn !== mine) break;
      if (bytes.byteLength) await playClip(bytes, mine);
    } catch (error) {
      console.warn("Sift voice: a clip didn't play", error);
    }
  }
  playing = false;
}
function enqueue(clip, mine) { queue.push(clip); playQueue(mine); }
function stopVoice() { queue = []; try { current?.stop(); } catch {} current = null; }

// iPhone: record in a call-style session, then switch back so replies play out loud through
// the speaker, even with the silent switch on.
function audioMode(type) { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch {} }

function clipBytes(base64) {
  return Uint8Array.from(atob(base64), (c) => c.charCodeAt(0)).buffer;
}

async function start(context) {
  audioMode("play-and-record");
  stream = stream ?? await navigator.mediaDevices.getUserMedia({ audio: true });
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) ?? "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.start();
  const analyser = context.createAnalyser(), data = new Uint8Array(256);
  context.createMediaStreamSource(stream).connect(analyser);
  meterContext = context;
  meter = setInterval(() => {
    analyser.getByteTimeDomainData(data);
    let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
    document.documentElement.style.setProperty("--level", Math.min(1, peak / 128 * 2.5).toFixed(2));
  }, 50);
  listeningAt = Date.now();
  set("listening");
}

async function finish() {
  set("waiting", "Okay, let me look…");
  const mine = ++turn;
  stopped = false; stopVoice();
  clearInterval(meter); meterContext?.close();
  document.documentElement.style.setProperty("--level", 0);
  const done = new Promise((resolve) => (recorder.onstop = resolve));
  recorder.stop();
  // The acknowledgement plays inside the tap, which also unlocks audio for the reply on iPhone.
  enqueue("/api/ack", mine);
  await done;
  stream.getTracks().forEach((track) => track.stop());
  stream = null;
  audioMode("playback"); // after the mic is off, so replies use the speaker
  if (turn !== mine) return; // stopped while the recording closed
  const view = newTurn();
  const settle = (text) => { if (turn === mine) set("idle", text); };
  try {
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    controller = new AbortController();
    const own = controller; // a late timer can only abort its own turn
    const timer = setTimeout(() => own.abort(), 330_000);
    const response = await fetch("/api/talk", { method: "POST", headers: { "Content-Type": blob.type }, body: blob, signal: controller.signal });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || "Something went wrong.");
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done: ended } = await reader.read();
      if (ended || turn !== mine) break;
      buffer += decoder.decode(value, { stream: true });
      let line;
      while ((line = buffer.indexOf("\n")) >= 0) {
        const event = JSON.parse(buffer.slice(0, line));
        buffer = buffer.slice(line + 1);
        if (event.type === "heard") {
          if (!event.text) {
            view.box.remove();
            if (!thread.querySelector(".turn")) thread.append(empty);
            settle("Didn't catch anything. Nothing was sent.");
            return;
          }
          view.you.textContent = event.text;
        } else if (event.type === "step") {
          view.steps.querySelectorAll(".step:not(.done)").forEach((s) => s.classList.add("done"));
          view.steps.append(el("li", "step", event.label));
          // Only the latest few steps; the count says how many came before.
          const all = view.steps.querySelectorAll(".step");
          all.forEach((s, i) => s.hidden = i < all.length - 4);
          const earlier = all.length - 4;
          let more = view.steps.querySelector(".more");
          if (earlier > 0) {
            if (!more) { more = el("li", "more"); view.steps.prepend(more); }
            more.textContent = `${earlier} earlier step${earlier === 1 ? "" : "s"}`;
          }
        } else if (event.type === "update") {
          hint.textContent = event.text;
        } else if (event.type === "text") {
          view.steps.querySelectorAll(".step").forEach((s) => s.classList.add("done"));
          view.reply.textContent = event.text.replace(/\*\*|__|`/g, "");
        } else if (event.type === "audio") {
          enqueue(clipBytes(event.data), mine);
        } else if (event.type === "error") {
          view.box.append(el("p", "note", event.message));
        }
        scroll();
      }
    }
    clearTimeout(timer); // only once the whole streamed answer has arrived
    view.steps.querySelectorAll(".step").forEach((s) => s.classList.add("done"));
    while ((playing || queue.length) && turn === mine && !stopped) await new Promise((r) => setTimeout(r, 120));
    settle();
  } catch (error) {
    if (turn === mine) view.box.append(el("p", "note", error.message));
    settle();
  }
}

let pressedAt = 0, listeningAt = 0;
function press() {
  unlockPlayer(); // every press, so the reply can always play
  if (state === "idle") {
    pressedAt = Date.now();
    set("starting");
    navigator.vibrate?.(10);
    // Made inside the tap so iPhone lets the level meter run.
    const context = new AudioContext();
    context.resume();
    start(context).catch((e) => {
      context.close(); stream?.getTracks().forEach((t) => t.stop()); stream = null;
      audioMode("playback");
      set("idle", "Microphone unavailable: " + e.message);
    });
  } else if (state === "listening") {
    finish();
  } else if (state === "waiting" || state === "speaking") {
    stopped = true; turn++; stopVoice(); controller?.abort();
    set("idle", "Stopped. The answer stays in Paseo.");
  }
}
// Tap to start and tap to send, or hold while you talk and let go to send.
button.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  try { button.setPointerCapture(event.pointerId); } catch {} // capture is a nicety, never a blocker
  press();
});
const release = () => {
  // A hold sends on release; a slow tap (let go before the mic had been open a moment) keeps listening.
  if (pressedAt && state === "listening" && Date.now() - listeningAt > 700) finish();
  pressedAt = 0;
};
button.addEventListener("pointerup", release);
button.addEventListener("pointercancel", release);
button.addEventListener("keydown", (event) => {
  if ((event.key === " " || event.key === "Enter") && !event.repeat) { event.preventDefault(); press(); }
});
set("idle");
</script>
</body>
</html>
