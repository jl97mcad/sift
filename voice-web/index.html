<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Sift</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e; --panel: #15171a; --line: rgba(255,255,255,.07);
    --text: #eceef0; --muted: #8b9096; --green: #a8e0a0; --mint: #6fd6c4; --violet: #9b8cff;
    --level: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before { /* soft light that follows the state */
    content: ""; position: fixed; inset: auto -20% -30% -20%; height: 70%; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--glow, var(--violet)) 22%, transparent), transparent);
    filter: blur(40px); opacity: .7; transition: background .6s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 10px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  #chip {
    font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); display: flex; gap: 6px; align-items: center;
  }
  #chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--glow, var(--muted)); }

  #thread {
    flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 22px;
    -webkit-mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent);
  }
  #empty { margin: auto 0; text-align: center; color: var(--muted); }
  #empty strong { display: block; color: var(--text); font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  .turn { display: flex; flex-direction: column; gap: 12px; animation: rise .35s ease-out both; }
  .you {
    align-self: flex-end; max-width: 85%; margin: 0; padding: 10px 14px; border-radius: 18px 18px 6px 18px;
    background: #23262b; color: var(--text);
  }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; animation: rise .25s ease-out both; }
  .step::before {
    content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--mint) 35%, transparent); border-top-color: var(--mint);
    animation: spin .8s linear infinite;
  }
  .step.done::before {
    content: "✓"; animation: none; border: 0; color: var(--mint); font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  .more { color: var(--muted); font-size: 12px; opacity: .7; padding-left: 24px; }
  .reply { margin: 0; white-space: pre-wrap; font-size: 17px; line-height: 1.55; letter-spacing: -.005em; }
  .reply:empty { display: none; }
  .note { color: var(--muted); font-size: 14px; margin: 0; }

  /* Bottom: the orb floats over one frosted dock that holds the text box. */
  footer {
    position: relative; display: flex; justify-content: center;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 85%, transparent) 30%);
  }
  #talk { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    position: relative; flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: transparent; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #talk:focus-visible { outline: 3px solid var(--green); outline-offset: 6px; }
  .orb, .halo { position: absolute; inset: 0; border-radius: 50%; }
  /* A soft orb: three blurred colour blobs drifting inside a circle, no hard edges. */
  .orb {
    overflow: hidden; isolation: isolate; background: #16122a;
    box-shadow: 0 12px 40px -10px color-mix(in srgb, var(--glow, var(--violet)) 75%, transparent), inset 0 0 0 1px rgba(255,255,255,.08);
    transform: scale(calc(1 + var(--level) * .2)); transition: transform .08s ease-out, box-shadow .6s;
  }
  .orb i { position: absolute; width: 85%; height: 85%; border-radius: 50%; filter: blur(8px); mix-blend-mode: screen; opacity: .95;
    animation: var(--drift-time, 9s) ease-in-out infinite alternate; }
  .orb i:nth-child(1) { background: var(--violet); top: -18%; left: -14%; animation-name: drift1; }
  .orb i:nth-child(2) { background: var(--mint); bottom: -20%; right: -16%; animation-name: drift2; }
  .orb i:nth-child(3) { background: var(--green); top: 30%; left: 20%; width: 60%; height: 60%; opacity: .7; animation-name: drift3; }
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.45), transparent 38%); }
  .halo { border: 2px solid color-mix(in srgb, var(--glow, var(--violet)) 60%, transparent); opacity: 0; }
  .dock { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); padding: 6px; border-radius: 30px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); }
  #hint { font-size: 13px; color: var(--muted); min-height: 1.5em; text-align: center; }

  body.listening { --glow: var(--green); }
  body.listening { --drift-time: 3s; }
  body.listening .halo { animation: ripple 1.6s ease-out infinite; }
  body.waiting { --glow: var(--mint); }
  body.waiting { --drift-time: 1.6s; }
  body.speaking { --glow: var(--violet); }
  body.speaking { --drift-time: 2.4s; }
  body.speaking .orb { animation: talkpulse .5s ease-in-out infinite alternate; }

  @property --turn { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes drift1 { to { transform: translate(28%, 22%) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-26%, -20%) scale(.92); } }
  @keyframes drift3 { to { transform: translate(-30%, 18%) scale(1.15); } }
  @keyframes breathe { 50% { filter: brightness(1.12) saturate(1.15); } }
  @keyframes talkpulse { to { transform: scale(1.07); } }
  @keyframes ripple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
  /* Work card, after ReUI's ai-chat-8: who was asked, then each check with a tick. */
  .job { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: rise .3s ease-out both; }
  .job .head { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .job .head .time { margin-left: auto; font-variant-numeric: tabular-nums; }
  .job .head::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); animation: breathe 1.2s ease-in-out infinite; }
  .job.done .head::before { background: var(--green); animation: none; }
  .job.failed .head::before { background: #ff8a7a; animation: none; }
  .job .title { font-size: 15px; color: var(--text); }
  .job ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .job li { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .job li::before { content: "✓"; color: var(--mint); font-weight: 700; width: 12px; }
  .job.running li:last-child::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--mint) 35%, transparent); border-top-color: var(--mint); animation: spin .8s linear infinite; }
  .you .label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em; }
  header .top { display: flex; gap: 8px; align-items: center; }
  #endChat { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  #endChat:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  form#ask { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  form#ask input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 16px; outline: none; }
  form#ask input::placeholder { color: var(--muted); }
  form#ask button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 16px; cursor: pointer; }
  form#ask button:disabled { opacity: .3; }
  .sift { margin: 0; font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>
<header><h1 id="name">Sift</h1><div class="top"><span id="chip">Ready</span><button id="endChat" type="button" hidden aria-label="End the conversation">End</button></div></header>
<main id="thread" aria-live="polite">
  <div id="empty"><strong>Just talk</strong>Tap the orb to talk. Tap it again to pause listening.<br>Talk over me to interrupt, or type instead.</div>
</main>
<footer>
  <div class="dock">
    <button id="talk" aria-label="Start talking"><span class="halo"></span><span class="orb"><i></i><i></i><i></i></span></button>
    <form id="ask" autocomplete="off"><input id="typed" aria-label="Type a question" aria-describedby="hint"><button aria-label="Send" disabled>↑</button></form>
  </div>
  <div id="hint" class="sr" role="status">Tap to start</div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const empty = $("empty"), button = $("talk"), hint = $("hint"), chip = $("chip"), thread = $("thread");
// ponytail: fixed loudness thresholds (0..1 RMS); tune here if a room cuts turns short or hears echoes.
const SPEECH = 0.045, BARGE = 0.12, END_SILENCE = 700, MIN_SPEECH = 450, MAX_TURN = 60_000, IDLE_PAUSE = 45_000, AFTER_SPEAKING = 700;
let floor = 0.01, deaf = 0; // the room's quiet level, and a moment after it speaks when it doesn't listen
// ponytail: echo-aware barge-in. While it speaks, the mic hears some of its own voice even with echo
// cancellation; that level is tracked and you must be clearly louder than it, for 300 ms, to cut in.
let echo = 0.03, clipStartedAt = 0, spokeUntil = 0;
const ECHO_RATIO = 2.5, BARGE_HOLD = 300, CLIP_ONSET = 350;
let muted = false; // tapped out: not listening, but the conversation (replies, news) carries on

let endAfterSpeech = false, on = false, phase = "off", stream, mic, analyser, data, recorder, chunks = [], speechStart = 0, lastLoud = 0, listenSince = 0, loopTimer;
let player, current, currentBytes, queue = [], playing = false, generation = 0, controller, later = [];
let resumable = null, turnEndedAt = 0;
let pending = null; // { text, count, bubble }: words said before a pause that cut you off; the next turn carries on
let turnCount = 0, carried = 0, heardNow = "", replyStarted = false, working = new Map(); // this turn's words; background jobs by id // what an interruption cut off, and when the last turn ended

function set(next, text) {
  phase = next;
  queueMicrotask(() => ($("typed").placeholder = hint.textContent || "Type instead"));
  setTimeout(chipWork, 0);
  document.body.className = { off: "idle", muted: "idle", listening: "listening", hearing: "listening", thinking: "waiting", speaking: "speaking" }[next];
  chip.textContent = { off: "Ready", muted: "Not listening", listening: "Listening", hearing: "Hearing you", thinking: "Thinking", speaking: "Speaking" }[next];
  hint.textContent = text ?? { off: "Tap to start", muted: "Not listening · tap to talk", listening: "Listening · tap to pause", hearing: "Go on…", thinking: "One sec…", speaking: "Talk over me to interrupt" }[next];
  button.setAttribute("aria-label", !on ? "Start talking" : { hearing: "Send now", listening: "Stop listening", muted: "Listen" }[phase] ?? "Interrupt and listen");
  $("endChat").hidden = !on;
}
function el(tag, cls, text) { const n = document.createElement(tag); n.className = cls; if (text) n.textContent = text; return n; }
function add(node) { empty.remove(); thread.append(node); thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" }); return node; }
function audioMode(type) { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch {} }

// ---- Speaking: one Web Audio context, unlocked by the first tap, plays every clip in order.
function unlockPlayer() {
  player = player ?? new (window.AudioContext || window.webkitAudioContext)();
  player.resume();
  const silence = player.createBufferSource();
  silence.buffer = player.createBuffer(1, 1, 22050);
  silence.connect(player.destination);
  silence.start(0);
}
const clipBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
async function playQueue() {
  if (playing) return;
  playing = true;
  const mine = generation;
  while (queue.length && mine === generation) {
    try {
      const bytes = queue.shift();
      currentBytes = bytes.slice(0); // decoding detaches the bytes; keep a copy to resume after a false interruption
      const buffer = await player.decodeAudioData(bytes);
      if (mine !== generation) break;
      if (player.state !== "running") await player.resume();
      if (on && phase !== "hearing") set("speaking");
      await new Promise((done) => {
        const source = player.createBufferSource();
        source.buffer = buffer; source.connect(player.destination); source.onended = done;
        current = source; source.start(); clipStartedAt = Date.now();
        if (turnEndedAt) { // time to first audio, measured here on the phone
          const ms = Date.now() - turnEndedAt; turnEndedAt = 0;
          fetch("/api/metric", { method: "POST", body: JSON.stringify({ ms }) }).catch(() => {});
        }
      });
    } catch (error) { console.warn("A clip didn't play", error); }
  }
  if (mine !== generation) return; // a newer loop owns the flags now
  current = null; playing = false;
  if (endAfterSpeech) { endAfterSpeech = false; end("Bye. Tap to talk again."); return; }
  if (on && phase === "speaking") muted ? set("muted") : listen();
}
function speak(b64) { queue.push(clipBytes(b64)); playQueue(); }
function hush() { endAfterSpeech = false; generation += 1; queue = []; try { current?.stop(); } catch {} current = null; playing = false; }

// ---- Listening: the microphone stays open for the conversation; loudness decides the turns.
async function begin() {
  unlockPlayer();
  audioMode("play-and-record");
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  mic = new (window.AudioContext || window.webkitAudioContext)();
  await mic.resume();
  analyser = mic.createAnalyser(); analyser.fftSize = 1024; data = new Float32Array(analyser.fftSize);
  mic.createMediaStreamSource(stream).connect(analyser);
  on = true;
  listen();
  loopTimer = setInterval(tick, 40);
}
function end(text) {
  pending?.bubble?.remove(); pending = null; muted = false; // a half-finished sentence never carries into the next chat
  on = false; hush(); controller?.abort();
  clearInterval(loopTimer);
  try { recorder?.state === "recording" && recorder.stop(); } catch {}
  stream?.getTracks().forEach((t) => t.stop()); stream = null;
  mic?.close(); mic = null;
  audioMode("playback");
  document.documentElement.style.setProperty("--level", 0);
  set("off", text);
}
function record() {
  if (recorder?.state === "recording") { recorder.ondataavailable = null; recorder.stop(); } // only one recorder feeds a turn
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) ?? "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.start();
}
function listen() {
  echo = Math.max(0.02, echo * 0.5); // relearn the echo level for the next reply
  record(); speechStart = 0; lastLoud = 0; listenSince = Date.now(); deaf = Date.now() + AFTER_SPEAKING; set("listening");
  // News that arrived while you were talking plays now.
  if (later.length) { const news = later; later = []; news.forEach(speak); }
}

function level() {
  analyser.getFloatTimeDomainData(data);
  let sum = 0; for (const v of data) sum += v * v;
  return Math.sqrt(sum / data.length);
}
function tick() {
  if (!on || !analyser) return;
  const rms = level(), now = Date.now();
  document.documentElement.style.setProperty("--level", Math.min(1, rms * 9).toFixed(2));
  if (phase === "thinking") {
    // You carried on before it answered: drop the half-turn and keep listening, joining both parts.
    // Talking is counted from the start (even before the first part's words are back) and acted on once they are.
    if (!muted && !replyStarted && rms > Math.max(SPEECH, floor * 3)) carried += 40;
    if (carried > 400 && heardNow && !replyStarted && !muted) {
      carried = 0;
      pending = { text: heardNow, count: turnCount + 1, bubble: lastBubble };
      lastReply?.remove();
      generation += 1; controller?.abort();
      lastLoud = now; listenSince = now; speechStart = now; set("hearing", "Go on…");
    }
    return;
  }
  if (phase === "speaking") {
    spokeUntil = now;
    if (now - clipStartedAt < CLIP_ONSET) { // learn this clip's echo first (capped); never a barge-in
      speechStart = 0;
      echo = Math.min(0.1, echo * 0.8 + rms * 0.2);
      return;
    }
    const bar = Math.max(BARGE, echo * ECHO_RATIO);
    if (rms > bar) {
      speechStart ||= now;
      if (now - speechStart > BARGE_HOLD) {
        resumable = [currentBytes, ...queue].filter(Boolean); // in case it was only a cough (replays this sentence)
        hush(); controller?.abort(); listen(); speechStart = now; set("hearing", "Go ahead, I stopped");
      }
    } else {
      speechStart = 0;
      if (rms < bar * 0.8) echo = Math.min(0.1, echo * 0.95 + rms * 0.05); // its own voice on the mic, capped so quiet talk can't raise the bar for good
    }
    return;
  }
  if (phase === "listening" || phase === "hearing") {
    if (now < deaf) return; // the tail of its own voice is not you talking
    if (phase === "listening") floor = floor * 0.97 + Math.min(rms, 0.05) * 0.03; // follow the room's hum
    if (rms > Math.max(SPEECH, floor * 3)) { lastLoud = now; if (!speechStart) speechStart = now; if (phase === "listening" && now - speechStart > 150) set("hearing"); }
    if (phase === "hearing" && now - lastLoud > END_SILENCE && lastLoud - speechStart > MIN_SPEECH) send();
    else if (phase === "hearing" && now - listenSince > MAX_TURN) send();
    else if (phase === "listening" && !speechStart && now - listenSince > IDLE_PAUSE) end(working.size ? "Paused. I'll still tell you when the work's done." : "Paused. Tap to talk again.");
    if (phase === "hearing" && now - lastLoud > END_SILENCE && lastLoud - speechStart <= MIN_SPEECH) { speechStart = 0; set("listening"); }
  }
}

async function send() {
  set("thinking");
  turnEndedAt = Date.now();
  heardNow = ""; replyStarted = false; speechStart = 0; carried = 0;
  const done = new Promise((resolve) => (recorder.onstop = resolve));
  const finished = recorder;
  finished.stop();
  await done;
  const blob = new Blob(chunks, { type: finished.mimeType || "audio/webm" });
  if (on && !muted) record(); // standby: if you carry on talking, nothing you say is lost
  const before = pending;
  pending = null;
  turnCount = before?.count ?? 0;
  before?.bubble?.remove();
  const headers = { "Content-Type": blob.type };
  if (before) { headers["x-said-before"] = encodeURIComponent(before.text); headers["x-continuations"] = String(before.count); }
  if (muted) headers["x-continuations"] = "2"; // you tapped out: you've finished, so never wait for more
  const unfinished = await converse("You said", (signal) => fetch("/api/turn", { method: "POST", headers, body: blob, signal }), before?.count ?? 0);
  if (unfinished && on) { listenSince = Date.now(); speechStart = 0; lastLoud = 0; set("listening", "Go on…"); }
}

/** One exchange, voice or typed: shows what was heard, streams the reply text and plays its speech. */
let lastBubble = null, lastReply = null;
async function converse(label, request, count = 0) {
  const mine = generation;
  const you = el("p", "you"), said = el("span", "words", "…");
  you.append(el("span", "label", label), said);
  const reply = el("p", "sift");
  add(you);
  lastBubble = you; lastReply = reply;
  let unfinished = false;
  controller = new AbortController();
  try {
    const response = await request(controller.signal);
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || "Something went wrong.");
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = "", spoke = false;
    for (;;) {
      const { value, done: ended } = await reader.read();
      if (ended) break;
      buffer += decoder.decode(value, { stream: true });
      let line;
      while ((line = buffer.indexOf("\n")) >= 0) {
        const event = JSON.parse(buffer.slice(0, line)); buffer = buffer.slice(line + 1);
        if (mine !== generation) continue;
        if (event.type === "heard") {
          if (event.unfinished) { said.textContent = event.text + " …"; pending = { text: event.text, count: count + 1, bubble: you }; unfinished = true; }
          else if (event.text) { said.textContent = event.text; heardNow = event.text; resumable = null; }
          else {
            you.remove();
            // Nothing real was said: if that cut it off, carry on where it stopped.
            if (resumable?.length) { const rest = resumable; resumable = null; rest.forEach((b) => queue.push(b)); playQueue(); spoke = true; }
          }
        }
        else if (event.type === "text") { if (!reply.isConnected) add(reply); reply.textContent = event.text.trimStart(); }
        else if (event.type === "audio") { spoke = true; replyStarted = true; speak(event.data); }
        else if (event.type === "error") add(el("p", "note", event.message));
        else if (event.type === "end") { endAfterSpeech = true; }
      }
    }
    if (unfinished) return true; // send() keeps listening for the rest
    if (endAfterSpeech && !spoke && !playing) { endAfterSpeech = false; end("Bye. Tap to talk again."); }
    else if (on && mine === generation && !spoke && !playing) muted ? set("muted") : listen();
  } catch (error) {
    if (error.name !== "AbortError") add(el("p", "note", error.message));
    if (on && phase === "thinking") muted ? set("muted") : listen();
  }
}

/** The header chip also says when a session is still working in the background. */
function chipWork() {
  const busy = [...working.values()];
  const base = { off: "Ready", muted: "Not listening", listening: "Listening", hearing: "Hearing you", thinking: "Thinking", speaking: "Speaking" }[phase] ?? "";
  chip.textContent = busy.length ? `${base} · ${busy.length === 1 ? busy[0] + " working" : busy.length + " working"}` : base;
}
const elapsed = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; };
const shortTask = (task) => { const t = task.replace(/^\(.*?\)\s*/, "").replace(/^(jon|he|she|they)\s+(says|asks|wants)[:,]?\s*/i, ""); return t.length > 110 ? t.slice(0, 107).trimEnd() + "…" : t; };
setInterval(() => cards.forEach((card, id) => { if (card.dataset.started && card.classList.contains("running")) card.querySelector(".time").textContent = elapsed(Date.now() - Number(card.dataset.started)); }), 1000);

// ---- Background work from the worker session: cards that update, and news spoken when ready.
const cards = new Map();
function showJob(job) {
  let card = cards.get(job.id);
  if (!card) {
    card = add(el("div", "job"));
    const head = el("div", "head"); head.append(el("span", "who"), el("span", "time"));
    card.append(head, el("div", "title"), el("ul", ""));
    cards.set(job.id, card);
  }
  if (job.status === "cancelled") { card.remove(); cards.delete(job.id); working.delete(job.id); chipWork(); return; }
  card.className = `job ${job.status}`;
  card.dataset.started = job.started ?? "";
  const who = job.to ?? "the worker", Who = who[0].toUpperCase() + who.slice(1);
  card.querySelector(".who").textContent = { queued: `Waiting for ${who}`, running: `Asked ${who}`, done: `${Who} answered`, failed: `${Who} didn't finish` }[job.status] ?? job.status;
  if (job.status !== "running") card.querySelector(".time").textContent = "";
  const title = card.querySelector(".title");
  title.textContent = shortTask(job.task); title.title = job.task;
  card.querySelector("ul").replaceChildren(...job.steps.filter((s) => s !== "Thinking").slice(-2).map((s) => el("li", "", s)));
  if (job.status === "running" || job.status === "queued") working.set(job.id, Who); else working.delete(job.id);
  chipWork();
}
const events = new EventSource("/api/events");
events.onmessage = (message) => {
  const event = JSON.parse(message.data);
  if (event.type === "job") showJob(event.job);
  if (event.type === "say") {
    add(el("p", "sift", event.text));
    if (phase === "hearing" || phase === "thinking") later.push(...event.audio); // never over your own turn
    else if (player) { if (!on) hint.textContent = "News from your worker"; event.audio.forEach(speak); }
  }
};
fetch("/api/config").then((r) => r.json()).then((c) => {
  $("name").textContent = c.assistant; document.title = c.assistant || "Voice"; c.jobs.forEach(showJob);
});

const form = $("ask"), typed = $("typed"), sendButton = form.querySelector("button");
typed.addEventListener("input", () => (sendButton.disabled = !typed.value.trim()));
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = typed.value.trim();
  if (!text) return;
  typed.value = ""; sendButton.disabled = true;
  pending?.bubble?.remove(); pending = null; // typing starts a fresh question
  unlockPlayer(); // the send tap lets the reply play
  hush(); controller?.abort();
  if (on) set("thinking");
  turnEndedAt = Date.now();
  converse("You typed", (signal) => fetch("/api/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal }));
});

// Tap in and out: the orb switches listening on and off; the conversation carries on until "End" or bye.
button.addEventListener("click", () => {
  if (!on) { muted = false; begin().catch((e) => end("Microphone unavailable: " + e.message)); return; }
  if (phase === "hearing") { muted = true; send(); return; } // you're done: send it, and stop listening
  if (phase === "listening") { muted = true; try { recorder?.state === "recording" && (recorder.ondataavailable = null, recorder.stop()); } catch {} set("muted"); return; }
  muted = false; // muted, thinking or speaking: listen now (interrupting anything it's saying)
  if (phase === "speaking" || phase === "thinking") { hush(); controller?.abort(); }
  listen(); set("listening", "Go ahead, I'm listening");
});
$("endChat").addEventListener("click", () => end("Ended. Tap to talk again."));
set("off");
</script>
</body>
